name: CI / Automated Testing & Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Build Go Server
        run: go build -v ./...

      - name: Run Server Unit Tests
        run: go test -v ./...

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Frontend Tests
        run: CI=true yarn test

      - name: Build Frontend Application
        run: yarn build

  docker-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: quality-of-life-app:test

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: quality-of-life-server:test

  security-and-lint:
    name: Secret Scan & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate JSON Syntax
        run: |
          python3 -c '
          import json, glob, sys
          for f in glob.glob("**/*.json", recursive=True):
              if "node_modules" not in f and ".git" not in f and "build" not in f and "dist" not in f:
                  try:
                      json.load(open(f))
                  except Exception as e:
                      print(f"Invalid JSON {f}: {e}")
                      sys.exit(1)
          print("All JSON files are syntactically valid!")
          '
