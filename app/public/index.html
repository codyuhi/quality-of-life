<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SVG favicon only: it adapts to the browser chrome via prefers-color-scheme.
         favicon.ico stays in public/ for legacy clients but is intentionally not linked. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe7df" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Compare cost of living, safety, healthcare, and quality of life metrics across 260+ major cities globally."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Cedar typography: Source Serif 4 (headings), Plus Jakarta Sans (UI), JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <!-- Apply the saved (or OS) theme before first paint to prevent a theme flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cdr_qol_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.add(theme === 'light' ? 'cdr-theme-light' : 'cdr-theme-dark');
          root.classList.remove(theme === 'light' ? 'cdr-theme-dark' : 'cdr-theme-light');
          document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ebe7df' : '#161614';
        } catch (e) {}
      })();
    </script>
    <title>Quality of Life</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
