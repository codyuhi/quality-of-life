<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Borderless Cedar glyph; adapts to the browser chrome via prefers-color-scheme.
       Open ring with a heartbeat pulse breaking out through the top-right gap. -->
  <style>
    .ring { stroke: #1f513f; }
    .pulse { stroke: #c7370f; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #f4f2ed; }
      .pulse { stroke: #e0532b; }
    }
  </style>
  <path class="ring" d="M 52 32 A 20 20 0 1 1 45.1 14.9" stroke-width="5.5" stroke-linecap="round"/>
  <path class="pulse" d="M 9 34 H 19 L 24 24 L 30 44 L 36 20 L 41 33 L 55 10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
